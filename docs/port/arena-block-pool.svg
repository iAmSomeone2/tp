<rect x="540" y="554" width="110" height="44" fill="#3d6694" stroke="#6aa0d8"/>
<text x="595.0" y="581" text-anchor="middle" font-size="12">alloc 3</text>
<rect x="650" y="554" width="268" height="44" fill="#26282b" stroke="#6aa0d8"/>
<line x1="650" y1="544" x2="650" y2="608" stroke="#ff6b5e" stroke-width="2.5"/><text x="656" y="548" font-size="12" fill="#ff6b5e">bump pointer</text>
<path d="M150,616 v6 h500 v-6" fill="none" stroke="#b4b8bf"/><text x="400" y="637" text-anchor="middle" font-size="12">used()</text>
<path d="M650,616 v6 h268 v-6" fill="none" stroke="#b4b8bf"/><text x="784.0" y="637" text-anchor="middle" font-size="12">available(): bumps from here, else a new chunk</text>
<text x="40" y="670" font-size="12" fill="#b4b8bf"><tspan font-weight="bold">release()</tspan> rewinds chunk 1 and gives back the rest · <tspan font-weight="bold">~Arena()</tspan> gives back every chunk · <tspan font-weight="bold">shrink_to_fit()</tspan> gives back the whole free blocks</text>
<text x="40" y="688" font-size="12" fill="#b4b8bf">at the end of the current chunk · individual deallocation does nothing.</text>
