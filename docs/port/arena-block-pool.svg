<text x="150" y="470" font-size="12" fill="#9da0a8">The table lives outside the blocks (2 B of owner ID per block: 1 = A, 2 = B, 0 = free), so an overrun can't corrupt it.</text>
<text x="846.0" y="320" text-anchor="middle" font-size="12" fill="#ff6b5e" font-weight="bold">p</text>
<path d="M864.0,338 C906.0,350 906.0,388 872.0,393" fill="none" stroke="#ff6b5e" marker-end="url(#ar)"/>
<text x="918" y="488" text-anchor="end" font-size="12" fill="#ff6b5e">owner_of(p): range check, then owners[owner_id[(p − base) &gt;&gt; 12]] → &amp;A, O(1)</text>
<line x1="342" y1="498" x2="150" y2="554" stroke="#6aa0d8" stroke-dasharray="4 3"/><line x1="390" y1="498" x2="918" y2="554" stroke="#6aa0d8" stroke-dasharray="4 3"/>
